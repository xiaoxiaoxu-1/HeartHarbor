    <!-- 虚拟人SDK - 使用ES6模块导入 -->
    <script type="module">
        // 直接加载demo项目中的SDK
        import('./avatar-sdk-web_demo/src/testSdk/3.1.2.1002/avatar-sdk-web_3.1.2.1002/index.js')
            .then(module => {
                console.log('SDK模块加载成功:', module);
                
                // 根据demo项目，默认导出是AvatarPlatform
                if (module.default) {
                    window.AvatarPlatform = module.default;
                    console.log('AvatarPlatform已设置:', window.AvatarPlatform);
                }
                
                // 检查是否有其他导出
                if (module.Interactive) {
                    window.Interactive = module.Interactive;
                    console.log('Interactive已设置:', window.Interactive);
                }
                
                // 触发SDK加载完成事件
                if (window.onSDKLoaded) {
                    window.onSDKLoaded();
                }
            })
            .catch(err => {
                console.error('SDK模块加载失败:', err);
                
                // 备用方式：使用script标签加载
                console.log('尝试备用方式加载SDK...');
                const script = document.createElement('script');
                script.src = './avatar-sdk-web_demo/src/testSdk/3.1.2.1002/avatar-sdk-web_3.1.2.1002/index.js';
                script.type = 'module';
                document.head.appendChild(script);
                
                script.onload = () => {
                    console.log('备用方式加载SDK成功');
                };
                
                script.onerror = (err) => {
                    console.error('备用方式加载SDK失败:', err);
                };
            });
    </script>
    <script>
        // SDK加载状态管理
        let sdkLoaded = false;
        
        // 监听SDK加载完成
        window.addEventListener('load', function() {
            // 延迟检查SDK是否加载成功
            setTimeout(function() {
                if (typeof window.Interactive !== 'undefined' || typeof window.AvatarPlatform !== 'undefined') {
                    onSDKLoaded();
                } else {
                    onSDKLoadError();
                }
            }, 1000);
        });
        
        function onSDKLoaded() {
            console.log('SDK文件加载成功');
            sdkLoaded = true;
            console.log('Interactive构造函数:', window.Interactive);
            console.log('AvatarPlatform构造函数:', window.AvatarPlatform);
            
            // 检查SDK类是否可用
            if (typeof window.Interactive === 'undefined' && typeof window.AvatarPlatform === 'undefined') {
                console.error('SDK类未定义，可能是SDK文件格式问题');
                showMessage('SDK加载异常，请检查控制台错误信息', 'error');
            } else {
                console.log('SDK类可用，可以初始化');
                // 启用初始化按钮
                const initBtn = document.getElementById('initBtn');
                if (initBtn) {
                    initBtn.disabled = false;
                    initBtn.innerHTML = '<i class="fas fa-cog"></i> 初始化SDK';
                }
            }
        }
        
        function onSDKLoadError() {
            console.error('SDK文件加载失败，请检查文件路径');
            showMessage('SDK文件加载失败，请检查文件路径', 'error');
            
            // 检查文件是否存在
            checkSDKFileExistence();
        }
        
        function checkSDKFileExistence() {
            // 尝试通过fetch检查文件是否存在
            fetch('./avatar-sdk-web_demo/public/vm-sdk/1.0.0/interactive.umd.js')
                .then(response => {
                    if (response.ok) {
                        console.log('SDK文件存在，但加载失败，可能是网络问题');
                        showMessage('SDK文件存在但加载失败，请刷新页面重试', 'warning');
                    } else {
                        console.error('SDK文件不存在，路径错误');
                        showMessage('SDK文件不存在，请检查文件路径', 'error');
                    }
                })
                .catch(error => {
                    console.error('检查SDK文件失败:', error);
                    showMessage('无法检查SDK文件，请确认文件路径', 'error');
                });
        }
    </script>

        // 等待SDK加载
        function waitForSDKLoaded() {
            return new Promise((resolve, reject) => {
                const maxWaitTime = 10000; // 10秒超时
                const startTime = Date.now();
                
                const checkSDK = () => {
                    if (typeof window.Interactive !== 'undefined' || typeof window.AvatarPlatform !== 'undefined') {
                        console.log('SDK加载完成');
                        resolve();
                        return;
                    }
                    
                    if (Date.now() - startTime > maxWaitTime) {
                        reject(new Error('SDK加载超时，请检查网络连接'));
                        return;
                    }
                    
                    setTimeout(checkSDK, 100);
                };
                
                checkSDK();
            });
        }

        // 初始化SDK - 严格按照测试文件的方式
        function initSDK() {
            console.log('5 - 初始化SDK');
            if (!checkSDKAvailability()) {
                return;
            }
            
            try {
                // 检查SDK可用性
                console.log('SDK构造函数:', window.AvatarPlatform);
                console.log('Interactive构造函数:', window.Interactive);
                
                // 确定使用哪个SDK类
                const SDKClass = window.Interactive || window.AvatarPlatform;
                if (!SDKClass) {
                    throw new Error('SDK类未定义，请检查SDK加载');
                }
                
                let interative = interactiveSDK;
                if (!interative) {
                    // 严格按照测试文件的配置方式
                    interactiveSDK = interative = new SDKClass({
                        useInlinePlayer: true,
                        binaryData: false,
                        logLevel: 0, // 设置为0启用详细日志
                        player: {
                            autoplay: true,
                            muted: true, // 必须设置为muted才能在大多数浏览器中自动播放
                            playsinline: true
                        },
                        apiInfo: {
                            serverUrl: XUNFEI_VIRTUAL_CONFIG.serverUrl,
                            appId: XUNFEI_VIRTUAL_CONFIG.appId,
                            apiKey: XUNFEI_VIRTUAL_CONFIG.apiKey,
                            apiSecret: XUNFEI_VIRTUAL_CONFIG.apiSecret,
                            sceneId: XUNFEI_VIRTUAL_CONFIG.sceneId
                        }
                    });
                    
                    console.log('SDK实例创建成功:', interactiveSDK);
                    showMessage('初始化成功 可以开启后续实例方法调用', 'success');

                    showMessage('请勿多次初始化 或先销毁当前实例', 'warning');

                updateCharacterMode('SDK已初始化');

        // 手动创建video元素 - 改进版本
        function createVideoElementManually(container) {
            console.log('尝试手动创建video元素');
            
            // 检查是否已经存在video元素
            const existingVideo = container.querySelector('video');
            if (existingVideo) {
                console.log('video元素已存在:', existingVideo);

            }
            
            // 创建video元素
            const videoElement = document.createElement('video');
            videoElement.id = 'avatar-video';
            videoElement.className = 'avatar-video';
            videoElement.autoplay = true;
            videoElement.playsInline = true;
            videoElement.muted = true; // 关键修复：必须设置为muted才能自动播放
            videoElement.style.width = '100%';
            videoElement.style.height = '100%';
            videoElement.style.objectFit = 'contain';
            videoElement.style.background = 'transparent';
            
            // 添加到容器
            container.appendChild(videoElement);
            
            console.log('手动创建video元素成功:', videoElement);
            
            // 监听video事件
            videoElement.addEventListener('playing', () => {
                console.log('手动创建的video开始播放');
                console.log('Video状态:', {
                    readyState: videoElement.readyState,
                    paused: videoElement.paused,
                    currentTime: videoElement.currentTime,
                    videoWidth: videoElement.videoWidth,
                    videoHeight: videoElement.videoHeight
                });
            });
            
            videoElement.addEventListener('loadeddata', () => {
                console.log('video loadeddata事件触发');
            });
            
            videoElement.addEventListener('canplay', () => {
                console.log('video canplay事件触发');
                // 关键修复：在canplay事件中尝试播放
                videoElement.play().catch(err => {
                    console.warn('自动播放失败:', err);
                });

            videoElement.addEventListener('error', (e) => {
                console.error('手动创建的video错误:', e);
                console.error('Video错误详情:', videoElement.error);
            });
            
            // 关键修复：尝试将player实例绑定到手动创建的video元素
            if (interactiveSDK && interactiveSDK.player) {
                console.log('尝试绑定player到手动创建的video元素');
                
                // 检查player是否有attachVideo方法
                if (interactiveSDK.player.attachVideo) {
                    console.log('使用attachVideo方法绑定video元素');

            // 显示输入中状态

            try {
                // 调用集成讯飞虚拟人的工作流生成回复
                const aiResponse = await sendMessageWithXunfei(message);
                
                // 隐藏输入指示器并添加AI回复
                hideTypingIndicator();
                await addAIMessage(aiResponse);

                console.error('消息发送失败:', error);
                hideTypingIndicator();
                
                // 显示错误信息
                await addAIMessage('抱歉，服务暂时不可用。我会继续用基础模式为您服务。');
                
                // 使用降级回复
                const fallbackResponse = getFallbackResponse(message);
                await addAIMessage(fallbackResponse);
            }
        }

                } else if (currentRole === 'counselor') {

                    roleParams = {
                        role: "专业顾问",
                        mood: "专业严谨",
                        style: "专业分析",
                        expertise: "心理咨询",
                        ai_persona: "专业心理咨询师"
                    };
                }
                
                const requestData = {
                    inputs: {
                        query: userMessage,
                        ...roleParams
                    },
                    query: userMessage,
                    response_mode: "blocking",
                    user: "heart-harbor-user"
                };

                console.log('Dify API请求:', {
                    url: apiUrl,
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${DIFY_CONFIG.apiKey}`
                    },
                    body: requestData
                });
                
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${DIFY_CONFIG.apiKey}`
                    },
                    body: JSON.stringify(requestData)
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('Dify API错误详情:', {
                        status: response.status,
                        statusText: response.statusText,
                        error: errorText
                    });
                    
                    throw new Error(`Dify API错误: ${response.status} ${response.statusText} - ${errorText}`);
                }

                const data = await response.json();
                console.log('Dify API完整响应:', data);
                
                // 直接返回answer字段
                if (data.answer) {
                    console.log('Dify聊天模式回复:', data.answer);
                    return data.answer;
                }
                
                throw new Error('Dify聊天模式返回数据格式异常');
                
            } catch (error) {
                console.error('Dify工作流调用失败:', error);
                
                // 降级到模拟回复
                return getFallbackResponse(userMessage);
            }
        }

        // 导出对话
        function exportChat() {
            const messages = chatBody.querySelectorAll('.message-content');
            let exportText = '心屿AI心灵伙伴对话记录\n\n';
            
            messages.forEach((message, index) => {
                const isAI = message.closest('.ai-message');
                const sender = isAI ? 'AI心灵伙伴' : '我';
                const time = message.querySelector('.message-time').textContent;
                const content = message.textContent.replace(time, '').trim();
                
                exportText += `${index + 1}. [${time}] ${sender}: ${content}\n\n`;
            });
            
            // 创建下载链接
            const blob = new Blob([exportText], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `心灵伙伴对话_${new Date().toISOString().split('T')[0]}.txt`;
            a.click();
            URL.revokeObjectURL(url);
        }

        // 语音识别功能
        function initSpeechRecognition() {
            // 创建语音识别实例
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            
            // 配置识别器
            recognition.continuous = false;
            recognition.interimResults = true;
            recognition.lang = 'zh-CN';
            
            // 识别开始事件
            recognition.onstart = function() {
                console.log('语音识别开始');
                isListening = true;
                voiceButton.classList.add('listening');
                voiceButton.innerHTML = '<i class="fas fa-circle"></i>';
                voiceButton.title = '正在聆听...';
                
                // 清空之前的识别结果
                finalTranscript = '';
                interimTranscript = '';
                
                // 显示语音识别状态
                showVoiceStatus('正在聆听...', 'listening');
            };
            
            // 识别结果事件
            recognition.onresult = function(event) {
                interimTranscript = '';
                
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript;
                    } else {
                        interimTranscript += event.results[i][0].transcript;
                    }
                }
                
                // 更新输入框显示实时识别结果
                messageInput.value = finalTranscript + interimTranscript;
                
                // 显示实时识别结果
                if (interimTranscript) {
                    showVoiceStatus(`识别中: ${interimTranscript}`, 'listening');
                }
            };
            
            // 识别结束事件
            recognition.onend = function() {
                console.log('语音识别结束');
                isListening = false;
                voiceButton.classList.remove('listening');
                voiceButton.innerHTML = '<i class="fas fa-microphone"></i>';
                voiceButton.title = '语音输入';
                
                // 如果有最终识别结果，自动发送
                if (finalTranscript.trim()) {
                    console.log('识别结果:', finalTranscript);
                    showVoiceStatus('识别完成', 'success');
                    
                    // 延迟发送，让用户看到识别结果
                    setTimeout(() => {
                        sendMessage();
                    }, 500);
                } else {
                    showVoiceStatus('未识别到语音', 'error');
                }
                
                // 清除状态显示
                setTimeout(() => {
                    hideVoiceStatus();
                }, 2000);
            };
            
            // 识别错误事件
            recognition.onerror = function(event) {
                console.error('语音识别错误:', event.error);
                isListening = false;
                voiceButton.classList.remove('listening');
                voiceButton.classList.add('error');
                voiceButton.innerHTML = '<i class="fas fa-exclamation-triangle"></i>';
                
                let errorMessage = '语音识别错误';
                switch (event.error) {
                    case 'not-allowed':
                        errorMessage = '请允许麦克风权限';
                        break;
                    case 'audio-capture':
                        errorMessage = '无法访问麦克风';
                        break;
                    case 'network':
                        errorMessage = '网络连接错误';
                        break;
                    case 'no-speech':
                        errorMessage = '未检测到语音';
                        break;
                    default:
                        errorMessage = `识别错误: ${event.error}`;
                }
                
                showVoiceStatus(errorMessage, 'error');
                
                // 恢复按钮状态
                setTimeout(() => {
                    voiceButton.classList.remove('error');
                    voiceButton.innerHTML = '<i class="fas fa-microphone"></i>';
                    voiceButton.title = '语音输入';
                    hideVoiceStatus();
                }, 3000);
            };
        }

                border-radius: 20px;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
                font-size: 14px;
                display: flex;
                align-items: center;
                gap: 8px;
                z-index: 100;
                border: 1px solid #e2e8f0;
                animation: slideDown 0.3s ease-out;
            `;
            
            // 根据类型设置颜色
            if (type === 'listening') {
                statusDiv.style.borderColor = '#5D8BF4';
                statusDiv.style.color = '#5D8BF4';
            } else if (type === 'success') {
                statusDiv.style.borderColor = '#48bb78';
                statusDiv.style.color = '#48bb78';
            } else if (type === 'error') {
                statusDiv.style.borderColor = '#f56565';
                statusDiv.style.color = '#f56565';
            }
            
            // 添加到输入区域
            const chatInput = document.querySelector('.ai-chat-input');
            if (chatInput) {
                chatInput.style.position = 'relative';
                chatInput.appendChild(statusDiv);
            }
        }
        
        // 隐藏语音识别状态
        function hideVoiceStatus() {
            const existingStatus = document.getElementById('voice-status');
            if (existingStatus) {
                existingStatus.remove();
            }
        }

        // 初始化讯飞虚拟人事件监听
        function initXunfeiEventListeners() {
            // 按钮已被删除，事件监听已整合到自动流程中
            console.log('虚拟人事件监听器已整合到自动流程中');
        }

        // 初始化VMS事件监听
        function initVMSEventListeners() {
            const startBtn = document.getElementById('startVMS');
            const stopBtn = document.getElementById('stopVMS');
            const toggleBtn = document.getElementById('toggleCharacter');

            if (startBtn) {
                startBtn.addEventListener('click', startVMS);
            }

            if (stopBtn) {
                stopBtn.addEventListener('click', stopVMS);
            }

            if (toggleBtn) {
                toggleBtn.addEventListener('click', function() {
                    const streamContainer = document.getElementById('remote_stream');
                    if (streamContainer) {
                        const isVisible = streamContainer.style.display !== 'none';
                        streamContainer.style.display = isVisible ? 'none' : 'flex';
                        this.innerHTML = isVisible ? 
                            '<i class="fas fa-eye"></i> 显示虚拟人' : 
                            '<i class="fas fa-eye-slash"></i> 隐藏虚拟人';
                    }
                });
            }
        }
        
        // VMS虚拟人启动函数
        function startVMS() {
            console.log('启动VMS虚拟人');
            try {
                // 检查SDK是否已加载
                if (typeof window.Interactive === 'undefined' && typeof window.AvatarPlatform === 'undefined') {
                    console.error('VMS SDK未加载');
                    showMessage('VMS SDK未加载，请稍后重试', 'error');
                    return;
                }
                
                // 自动启动虚拟人流程
                autoStartVirtualHuman();
                
                // 更新按钮状态
                const startBtn = document.getElementById('startVMS');
                const stopBtn = document.getElementById('stopVMS');
                if (startBtn) startBtn.disabled = true;
                if (stopBtn) stopBtn.disabled = false;
                
                showMessage('VMS虚拟人启动中...', 'success');
                
            } catch (error) {
                console.error('启动VMS失败:', error);
                showMessage('启动VMS失败: ' + error.message, 'error');
            }
        }
        
        // VMS虚拟人停止函数
        function stopVMS() {
            console.log('停止VMS虚拟人');
            try {
                // 停止虚拟人播放
                if (window.avatarInstance) {
                    window.avatarInstance.stop();
                    delete window.avatarInstance;
                }
                
                // 清理相关资源
                if (window.characterWebSocket) {
                    window.characterWebSocket.close();
                    delete window.characterWebSocket;
                }
                
                // 重置状态
                window.isVirtualHumanStarted = false;
                
                // 更新按钮状态
                const startBtn = document.getElementById('startVMS');
                const stopBtn = document.getElementById('stopVMS');
                if (startBtn) startBtn.disabled = false;
                if (stopBtn) stopBtn.disabled = true;
                
                // 更新状态显示
                const sdkStatus = document.getElementById('sdkStatus');
                if (sdkStatus) {
                    sdkStatus.textContent = '已停止';
                }
                
                showMessage('VMS虚拟人已停止', 'success');
                
            } catch (error) {
                console.error('停止VMS失败:', error);
                showMessage('停止VMS失败: ' + error.message, 'error');
            }
        }

        // 聊天记录功能
        
        // 生成会话ID
        function generateSessionId() {
            return 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        }
        
        // 保存聊天记录到本地存储
        async function saveChatHistory() {
            try {
                const sessionData = {
                    sessionId: currentSessionId,
                    startTime: new Date().toISOString(),
                    role: currentRole,
                    messages: chatHistory,
                    messageCount: chatHistory.length
                };
                
                // 获取现有会话列表
                let sessions = JSON.parse(localStorage.getItem('aiChatSessions') || '[]');
                
                // 检查是否已存在当前会话
                const existingIndex = sessions.findIndex(session => session.sessionId === currentSessionId);
                if (existingIndex !== -1) {
                    // 更新现有会话
                    sessions[existingIndex] = sessionData;
                } else {
                    // 添加新会话（最多保存10个会话）
                    sessions.unshift(sessionData);
                    if (sessions.length > 10) {
                        sessions = sessions.slice(0, 10);
                    }
                }
                
                localStorage.setItem('aiChatSessions', JSON.stringify(sessions));
                console.log('聊天记录已保存到本地存储，当前会话:', currentSessionId);
                
            } catch (error) {
                console.error('保存聊天记录到本地存储失败:', error);
            }
        }
        
        // 加载聊天记录
        async function loadChatHistory(sessionId = null) {
            try {
                // 首先尝试从Supabase加载
                const supabaseLoaded = await loadChatHistoryFromSupabase(sessionId);
                if (supabaseLoaded) {
                    return true;
                }
                
                // 如果Supabase加载失败，回退到本地存储
                const sessions = JSON.parse(localStorage.getItem('aiChatSessions') || '[]');
                
                if (sessionId) {
                    // 加载指定会话
                    const session = sessions.find(s => s.sessionId === sessionId);
                    if (session) {
                        chatHistory = session.messages || [];
                        currentSessionId = session.sessionId;
                        currentRole = session.role || 'companion';
                        
                        // 清空聊天界面并重新渲染消息
                        chatBody.innerHTML = '';
                        chatHistory.forEach(msg => {
                            if (msg.type === 'user') {
                                addUserMessageToUI(msg.content, msg.timestamp);
                            } else if (msg.type === 'ai') {
                                addAIMessageToUI(msg.content, msg.timestamp);
                            }
                        });
                        
                        // 更新角色选择
                        if (document.getElementById(currentRole)) {
                            document.getElementById(currentRole).checked = true;
                        }
                        
                        console.log('聊天记录加载成功，会话:', sessionId);
                        return true;
                    }
                } else {
                    // 加载最新会话
                    if (sessions.length > 0) {
                        const latestSession = sessions[0];
                        return loadChatHistory(latestSession.sessionId);
                    }
                }
                
            } catch (error) {
                console.error('加载聊天记录失败:', error);
            }
            return false;
        }
        
        // 从Supabase加载聊天记录
        async function loadChatHistoryFromSupabase(sessionId = null) {
            try {
                // 检查用户是否已登录
                const user = await window.HeartHarborServices.AuthService.getCurrentUser();
                if (!user.data.user) {
                    console.warn('用户未登录，跳过Supabase加载');
                    return false;
                }
                
                // 获取用户的聊天会话
                const sessionsResult = await window.HeartHarborServices.AIChatService.getSessions();
                if (!sessionsResult.success) {
                    console.error('获取Supabase会话失败:', sessionsResult.error);
                    return false;
                }
                
                const sessions = sessionsResult.data || [];
                if (sessions.length === 0) {
                    console.log('Supabase中没有聊天会话');
                    return false;
                }
                
                // 选择会话
                let targetSession = null;
                if (sessionId) {
                    targetSession = sessions.find(s => s.id === sessionId);
                } else {
                    // 选择最新的会话
                    targetSession = sessions[0];
                }
                
                if (!targetSession) {
                    console.log('未找到指定的Supabase会话');
                    return false;
                }
                
                // 获取会话消息
                const messagesResult = await window.HeartHarborServices.AIChatService.getMessages(targetSession.id);
                if (!messagesResult.success) {
                    console.error('获取Supabase消息失败:', messagesResult.error);
                    return false;
                }
                
                const messages = messagesResult.data || [];
                
                // 转换消息格式
                chatHistory = messages.map(msg => ({
                    type: msg.role === 'user' ? 'user' : 'ai',
                    content: msg.content,
                    timestamp: msg.created_at,
                    sessionId: targetSession.id
                }));
                
                currentSessionId = targetSession.id;
                currentRole = 'companion'; // 默认角色
                
                // 保存Supabase会话ID到本地存储
                localStorage.setItem('supabase_session_id', targetSession.id);
                
                // 清空聊天界面并重新渲染消息
                chatBody.innerHTML = '';
                chatHistory.forEach(msg => {
                    if (msg.type === 'user') {
                        addUserMessageToUI(msg.content, msg.timestamp);
                    } else if (msg.type === 'ai') {
                        addAIMessageToUI(msg.content, msg.timestamp);
                    }
                });
                
                console.log('从Supabase加载聊天记录成功，会话:', targetSession.id);
                return true;
                
            } catch (error) {
                console.error('从Supabase加载聊天记录异常:', error);
                return false;
            }
        }
        
        // 获取会话列表
        async function getChatSessions() {
            try {
                // 首先尝试从Supabase获取会话列表
                const user = await window.HeartHarborServices.AuthService.getCurrentUser();
                if (user.data.user) {
                    const sessionsResult = await window.HeartHarborServices.AIChatService.getSessions();
                    if (sessionsResult.success && sessionsResult.data && sessionsResult.data.length > 0) {
                        // 转换Supabase会话格式为本地格式
                        const supabaseSessions = sessionsResult.data.map(session => ({
                            sessionId: session.id,
                            startTime: session.created_at,
                            role: 'companion', // 默认角色
                            messages: [], // 消息内容在加载时单独获取
                            messageCount: session.message_count || 0,
                            title: session.title || 'AI心灵伙伴对话',
                            isSupabase: true // 标记为Supabase会话
                        }));
                        
                        // 合并本地会话和Supabase会话
                        const localSessions = JSON.parse(localStorage.getItem('aiChatSessions') || '[]');
                        const allSessions = [...supabaseSessions, ...localSessions];
                        
                        // 按时间排序（最新的在前）
                        allSessions.sort((a, b) => new Date(b.startTime) - new Date(a.startTime));
                        
                        return allSessions;
                    }
                }
                
                // 如果Supabase获取失败，返回本地会话
                return JSON.parse(localStorage.getItem('aiChatSessions') || '[]');
                
            } catch (error) {
                console.error('获取会话列表失败:', error);
                return JSON.parse(localStorage.getItem('aiChatSessions') || '[]');
            }
        }
        
        // 删除会话
        async function deleteChatSession(sessionId) {
            try {
                // 删除本地存储的会话
                let sessions = getChatSessions();
                sessions = sessions.filter(session => session.sessionId !== sessionId);
                localStorage.setItem('aiChatSessions', JSON.stringify(sessions));
                
                // 删除Supabase中的会话
                try {
                    const user = await window.HeartHarborServices.AuthService.getCurrentUser();
                    if (user.data.user) {
                        const deleteResult = await window.HeartHarborServices.AIChatService.deleteSession(sessionId);
                        if (deleteResult.success) {
                            console.log('Supabase会话已删除:', sessionId);
                        } else {
                            console.warn('Supabase会话删除失败:', deleteResult.error);
                        }
                    }
                } catch (supabaseError) {
                    console.warn('删除Supabase会话异常:', supabaseError);
                }
                
                // 如果删除的是当前会话，创建新会话
                if (sessionId === currentSessionId) {
                    await startNewSession();
                }
                
                console.log('会话已删除:', sessionId);
                return true;
                
            } catch (error) {
                console.error('删除会话失败:', error);
                return false;
            }
        }
        
        // 开始新会话
        async function startNewSession() {
            currentSessionId = generateSessionId();
            chatHistory = [];
            chatBody.innerHTML = '';
            
            // 在Supabase中创建新会话
            try {
                const user = await window.HeartHarborServices.AuthService.getCurrentUser();
                if (user.data.user) {
                    const sessionResult = await window.HeartHarborServices.AIChatService.createSession('AI心灵伙伴对话');
                    if (sessionResult.success) {
                        currentSessionId = sessionResult.data.id;
                        localStorage.setItem('supabase_session_id', currentSessionId);
                        console.log('Supabase新会话已创建:', currentSessionId);
                    } else {
                        console.warn('Supabase会话创建失败，使用本地会话ID');
                    }
                }
            } catch (error) {
                console.warn('Supabase会话创建异常，使用本地会话ID:', error);
            }
            
            // 添加欢迎消息
            const welcomeMessage = currentRole === 'companion' ? 
                '你好！我是你的心灵伙伴，很高兴能陪伴你。有什么想聊的吗？' : 
                '您好！我是专业心理咨询师，很乐意为您提供专业的心理支持。';
            
            addAIMessageToUI(welcomeMessage, new Date().toISOString());
            
            console.log('新会话已开始:', currentSessionId);
        }
        
        // 添加消息到聊天记录
        async function addMessageToHistory(type, content) {
            const message = {
                type: type,
                content: content,
                timestamp: new Date().toISOString(),
                sessionId: currentSessionId
            };
            
            chatHistory.push(message);
            
            // 同时保存到本地存储和Supabase数据库
            await saveChatHistory();
            await saveMessageToSupabase(type, content);
        }
        
        // 带时间戳的用户消息UI
        function addUserMessageToUI(message, timestamp = null) {
            const messageElement = document.createElement('div');
            messageElement.className = 'message user-message';
            messageElement.innerHTML = `
                <div class="message-content">
                    ${message}
                    <div class="message-time">${timestamp ? formatTimestamp(timestamp) : getCurrentTime()}</div>
                </div>
            `;
            chatBody.appendChild(messageElement);
            scrollToBottom();
        }
        
        // 带时间戳的AI消息UI
        function addAIMessageToUI(message, timestamp = null) {
            const messageElement = document.createElement('div');
            messageElement.className = 'message ai-message';
            messageElement.innerHTML = `
                <div class="message-avatar">
                    <i class="fas fa-robot"></i>
                </div>
                <div class="message-content">
                    ${message}
                    <div class="message-time">${timestamp ? formatTimestamp(timestamp) : getCurrentTime()}</div>
                </div>
            `;
            chatBody.appendChild(messageElement);
            scrollToBottom();
        }
        
        // 格式化时间戳
        function formatTimestamp(timestamp) {
            const date = new Date(timestamp);
            const now = new Date();
            const diff = now - date;
            
            // 如果是今天
            if (date.toDateString() === now.toDateString()) {
                return date.toLocaleTimeString('zh-CN', { 
                    hour: '2-digit', 
                    minute: '2-digit' 
                });
            }
            
            // 如果是昨天
            const yesterday = new Date(now);
            yesterday.setDate(yesterday.getDate() - 1);
            if (date.toDateString() === yesterday.toDateString()) {
                return '昨天 ' + date.toLocaleTimeString('zh-CN', { 
                    hour: '2-digit', 
                    minute: '2-digit' 
                });
            }
            
            // 其他情况显示完整日期
            return date.toLocaleDateString('zh-CN') + ' ' + 
                   date.toLocaleTimeString('zh-CN', { 
                       hour: '2-digit', 
                       minute: '2-digit' 
                   });
        }
        
        // 保存消息到Supabase数据库
        async function saveMessageToSupabase(type, content) {
            try {
                // 检查用户是否已登录
                const user = await window.HeartHarborServices.AuthService.getCurrentUser();
                if (!user.data.user) {
                    console.warn('用户未登录，跳过Supabase保存');
                    return;
                }
                
                // 检查是否已有Supabase会话
                let supabaseSessionId = localStorage.getItem('supabase_session_id');
                if (!supabaseSessionId) {
                    // 创建新的Supabase会话
                    const sessionResult = await window.HeartHarborServices.AIChatService.createSession('AI心灵伙伴对话');
                    if (sessionResult.success) {
                        supabaseSessionId = sessionResult.data.id;
                        localStorage.setItem('supabase_session_id', supabaseSessionId);
                        console.log('新的Supabase会话已创建:', supabaseSessionId);
                    }
                }
                
                if (supabaseSessionId) {
                    // 保存消息到Supabase
                    const role = type === 'user' ? 'user' : 'assistant';
                    const messageResult = await window.HeartHarborServices.AIChatService.addMessage(
                        supabaseSessionId, 
                        role, 
                        content
                    );
                    
                    if (messageResult.success) {
                        console.log('消息已保存到Supabase');
                    } else {
                        console.warn('Supabase消息保存失败:', messageResult.error);
                    }
                }
                
            } catch (error) {
                console.error('保存消息到Supabase异常:', error);
            }
        }
        
        // 初始化应用
        async function initApp() {
            try {
                console.log('开始初始化AI心灵伙伴应用...');
                
                // 检查登录状态
                const isLoggedIn = await checkLoginStatus();
                
                if (!isLoggedIn) {
                    console.log('用户未登录，显示未授权界面');
                    showUnauthorizedView();
                    return;
                }
                
                console.log('用户已登录，继续初始化...');
                
                // 初始化事件监听器
                initEventListeners();
                
                // 尝试加载之前的聊天记录
                await loadChatHistory();
                
                // 初始化讯飞虚拟人
                initXunfeiVirtualHuman();
                
                // 初始化虚拟人物
                initVirtualCharacter();
                
                // 初始化虚拟人物形象选择器
                initAvatarSelector();
                
                // 启用发送按钮
                if (sendButton) sendButton.disabled = false;
                
                console.log('AI心灵伙伴应用初始化完成');
                
            } catch (error) {
                console.error('应用初始化失败:', error);
                showMessage('应用初始化失败: ' + error.message, 'error');
                
                // 启用降级模式
                enableFallbackMode();
            }
        }
        
        // 启用降级模式
        function enableFallbackMode() {
            console.log('启用降级模式');
            
            // 启用基础聊天功能
            if (sendButton) sendButton.disabled = false;
            
            // 显示基础虚拟人物
            loadStaticCharacter();
            
            // 更新状态显示
            updateCharacterMode('基础模式 - 仅支持文本聊天');
            
            showMessage('已启用基础模式，虚拟人功能暂时不可用', 'warning');
        }
        
        // 页面加载完成后初始化应用
        document.addEventListener('DOMContentLoaded', function() {
            console.log('页面DOM加载完成，开始初始化应用...');
            
            // 延迟初始化以确保所有资源加载完成
            setTimeout(() => {
                initApp();
            }, 100);
        });
        
        // 防止页面卸载时数据丢失
        window.addEventListener('beforeunload', function() {
            if (chatHistory.length > 0) {
                saveChatHistory();
            }
        });
    </script>
